name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package
        env:
          SIGNING_IDENTITY: "-"
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: Click-macOS
          path: |
            build/Click-macOS-*.zip
            build/Click-macOS-*.dmg
          retention-days: 14
